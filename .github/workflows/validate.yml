name: HUFT Roster validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find public/js scripts -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
          node --check scripts/import-workbook.mjs

      - name: Validate frontend configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/login.html
          test -s public/js/huft-config.js
          test -s public/js/huft-supabase.js
          test -s public/js/huft-api.js
          ! grep -Eq 'YOUR_PROJECT_REF|YOUR_PUBLISHABLE_OR_ANON_KEY' public/js/huft-config.js
          ! grep -R -n -E 'service_role|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*["'\''"][^$]' public

      - name: Validate database migrations
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/migrations/001_initial_schema.sql
          test -s supabase/migrations/002_huft_integration.sql
