        return reloadAfter(res).then(function () { state.tab = 'removed'; render(); });
      }).catch(function (err) { b.disabled = false; toast(err.message || 'Could not restore employee.', true); });
    }
    else if (act === 'recordPunctuality') openPunctualityRecord(b.dataset.store, b.dataset.name, b.dataset.employeeId);
    else if (act === 'punctualityHistory') openPunctualityHistory(b.dataset.store, b.dataset.name, b.dataset.employeeId);
    else if (act === 'newEmployeeRequest') openEmployeeRequestForm();
    else if (act === 'refreshWorkRequests') { state.workRequestsLoaded = false; state.workRequestsLoading = false; render(); }
    else if (act === 'refreshLiveNotifications') { state.workRequestsLoaded = false; state.workRequestsLoading = false; state.deploymentRequestsLoaded = false; state.deploymentRequestsLoading = false; render(); }
    else if (act === 'reviewWorkRequest') {
      var decision = b.dataset.decision;
      if (decision !== 'changes' && !window.confirm('Confirm you want to ' + decision + ' this employee request?')) return;
      var note = window.prompt('Optional manager note:', '');
      if (note === null) return;
      b.disabled = true;
      call('reviewEmployeeRequest', { id:b.dataset.id, decision:decision, notes:note }).then(function (res) {
        state.workRequests = res.requests || []; state.workRequestsLoaded = true; state.workRequestsLoading = false;
        toast(res.message || 'Request reviewed.'); render();
        ensureRange(state.date, true).then(render, function () {});
      }).catch(function (err) { b.disabled = false; toast(err.message || 'Could not review request.', true); });
    }    else if (act === 'refreshDeployments') {
      state.deploymentRequestsLoaded = false; state.deploymentRequestsLoading = false; render();
    }
    else if (act === 'reviewDeployment') {
      var deploymentDecision = b.dataset.decision, deploymentNotes = '';
      if (deploymentDecision === 'changes') {
        deploymentNotes = window.prompt('What needs to change before this deployment can be approved?', '');
        if (deploymentNotes === null || !deploymentNotes.trim()) return;
      } else if (!window.confirm('Confirm you want to ' + deploymentDecision + ' this deployment request?')) return;
      b.disabled = true;
      call('reviewDeploymentRequest', { id:b.dataset.id, decision:deploymentDecision, notes:deploymentNotes }).then(function (res) {
        state.deploymentRequests = res.requests || []; state.deploymentRequestsLoaded = true;
        toast(res.message || 'Deployment request updated.'); render();
        ensureRange(state.date, true).then(render, function () {});
      }).catch(function (err) { b.disabled = false; toast(err.message || 'Could not review deployment.', true); });
    }
    else if (act === 'saveEmailRecipient') {
      var recipientStore = b.dataset.store || '', recipientInput = Array.prototype.filter.call(document.querySelectorAll('[data-email-store]'), function (input) { return input.dataset.emailStore === recipientStore; })[0];
      b.disabled = true;
      call('setEmailRecipient', { store:recipientStore, email:recipientInput ? recipientInput.value : '' }).then(function (res) {
        state.emailAdminData = res; toast('Approval email saved for ' + recipientStore + '.'); render();
      }).catch(function (err) { b.disabled = false; toast(err.message || 'Could not save approval email.', true); });
    }    else if (act === 'saveEmailTemplate') {
      var templateId = ($('#emailTemplateSelect') || {}).value || '', emailSubject = ($('#emailSubject') || {}).value || '', emailBody = ($('#emailBody') || {}).value || '';
      var emailEnabled = !!($('#emailEnabled') || {}).checked;
      b.disabled = true;
      call('saveEmailTemplate', { id:templateId, subject:emailSubject, body:emailBody, enabled:emailEnabled }).then(function (res) {
        state.emailAdminData = res; state.emailTemplateId = templateId; toast('Email template saved.'); render();
      }).catch(function (err) { b.disabled = false; toast(err.message || 'Could not save template.', true); });
    }
    else if (act === 'testEmailTemplate') {
      var testId = ($('#emailTemplateSelect') || {}).value || '';
      b.disabled = true;
      call('sendEmailTemplateTest', { id:testId, recipient:state.email }).then(function (res) {
        toast(res.message || 'Test email sent.'); return call('getEmailAdminData');
      }).then(function (res) { state.emailAdminData = res; render(); }).catch(function (err) { b.disabled = false; toast(err.message || 'Test email failed.', true); });
    }
    else if (act === 'retryEmail') {
      b.disabled = true;
      call('retryFailedEmail', { id:b.dataset.id }).then(function (res) {
        state.emailAdminData = res; toast('Failed email retried.'); render();
      }).catch(function (err) { b.disabled = false; toast(err.message || 'Could not retry email.', true); });
    }
    else if (act === 'refreshEmailAdmin') {
      state.emailAdminData = null; state.emailAdminLoading = false; render();
    }    else if (act === 'grantStoreAccess') {
      var email = ($('#accessEmail') || {}).value || '', accessRole = ($('#accessRole') || {}).value || 'Editor';
      var accessStore = ($('#accessStore') || {}).value || '', sendInvite = b.dataset.sendInvite === 'true';
      if (!email.trim() || (accessRole === 'Editor' && !accessStore)) { toast('Enter an email and choose a store when granting store access.', true); return; }
      b.disabled = true;
      call('setRosterAccess', { email: email, store: accessStore, access: accessRole }).then(function (res) {
        state.accessEntries = res.entries || []; state.accessLoaded = true;
        if (!sendInvite) { toast('Access granted to ' + email.toLowerCase()); render(); return; }
        return call('sendRosterInvitation', { email: email, store: accessStore, access: accessRole }).then(function () {
          toast('Access granted and invitation sent to ' + email.toLowerCase()); render();
        }).catch(function (err) {
          toast('Access granted, but the invitation email failed: ' + err.message, true); render();
        });
      }).catch(function (err) { b.disabled = false; toast(err.message || 'Could not grant access.', true); });
    }
    else if (act === 'revokeStoreAccess') {
      call('setRosterAccess', { email: b.dataset.email, store: b.dataset.store, access: b.dataset.access, remove: true }).then(function (res) {
        state.accessEntries = res.entries || []; state.accessLoaded = true; toast('Store access revoked.'); render();
      }).catch(function (err) { toast(err.message || 'Could not revoke access.', true); });
    }
    else if (act === 'removeStaff') openRemove(b.dataset.id);
    else if (act === 'moveStaff') openMove(b.dataset.id);
    else if (act === 'addStore') openAddStore();
  });
  $('#modal').addEventListener('click', function (e) {
    var day = e.target.closest('[data-act=profileDate]');
    if (day) { var iso = day.dataset.date; closeModal(); setDate(iso); return; }
    if (e.target.id === 'modal' || e.target.closest('[data-act=mclose]')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('#modal').classList.contains('open')) closeModal();
  });

  function handleEmailActionLink() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('huftAction') !== 'email') return;
    var kind = params.get('kind') || '', id = params.get('id') || '', choice = params.get('choice') || '';
    var allowed = ['approve','reject','changes'];
    var cleanUrl = new URL(window.location.href);
    ['huftAction','kind','id','choice'].forEach(function (key) { cleanUrl.searchParams.delete(key); });
    window.history.replaceState({}, document.title, cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
    if (!id || ['deployment','employee'].indexOf(kind) < 0 || allowed.indexOf(choice) < 0) {
      toast('This email action link is invalid.', true); return;
    }
    call('getEmailActionContext', { kind:kind, id:id }).then(function (ctx) {
      var labels = { approve:'Approve request', reject:'Reject request', changes:'Request changes' };
      var title = kind === 'deployment' ? 'Confirm deployment · ' + ctx.employee : 'Confirm employee request · ' + ctx.employee;
      var summary = kind === 'deployment'
        ? '<div><strong>Employee:</strong> ' + esc(ctx.employee) + '</div><div><strong>Home store:</strong> ' + esc(ctx.fromStore) + '</div><div><strong>Destination:</strong> ' + esc(ctx.store) + '</div><div><strong>Dates:</strong> ' + esc(ctx.dateRange) + '</div><div><strong>Shift:</strong> ' + esc(ctx.shift) + '</div>'
        : '<div><strong>Request:</strong> ' + esc(ctx.requestType) + '</div><div><strong>Employee:</strong> ' + esc(ctx.employee) + '</div><div><strong>Store:</strong> ' + esc(ctx.store) + '</div><div><strong>Date:</strong> ' + esc(fmtShort(ctx.date)) + '</div><div><strong>Shift:</strong> ' + esc(ctx.previousShift || '—') + (ctx.requestedShift ? ' → ' + esc(ctx.requestedShift) : '') + '</div>';
      var notes = '<div class="fld" style="margin-top:12px"><label for="emailActionNotes">' + (choice === 'changes' ? 'Required changes' : 'Remarks (optional)') + '</label><textarea class="inp" id="emailActionNotes" name="notes" rows="3" maxlength="1000" ' + (choice === 'changes' ? 'required' : '') + ' placeholder="' + (choice === 'changes' ? 'Explain what must be updated' : 'Add a note for the requester') + '"></textarea></div>';
      openModal(title, 'Review the details below. The request changes only after you select the confirmation button.', '<div class="email-action-summary">' + summary + '</div>' + notes, labels[choice], function (values) {
        if (choice === 'changes' && !String(values.notes || '').trim()) throw new Error('Explain what needs to change.');
        var method = kind === 'deployment' ? 'reviewDeploymentRequest' : 'reviewEmployeeRequest';
        return call(method, { id:id, decision:choice, notes:values.notes || '' }).then(function (result) {
          if (kind === 'deployment') {
            state.deploymentRequests = result.requests || []; state.deploymentRequestsLoaded = true; state.tab = 'deployments';
          } else {
            state.workRequests = result.requests || []; state.workRequestsLoaded = true; state.tab = 'approvals';
          }
          toast(result.message || 'Request updated.');
          return ensureRange(state.date, true).then(function () { render(); return result; }, function () { render(); return result; });
        });
      });
    }).catch(function (err) { toast(err.message || 'This request cannot be reviewed from this account.', true); });
  }
  /* ---------- boot ---------- */
  var saved = null, savedStore = null;
  try { saved = localStorage.getItem('huft-theme'); savedStore = localStorage.getItem('huft-store'); } catch (e) {}
  applyTheme(saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  busy(true);
  call('getBootstrap').then(function (b) {
    busy(false);
    state.todayIso = b.todayIso; state.appUrl = b.appUrl || ''; state.stores = b.stores; state.months = b.months;
    state.isAdmin = !!b.isAdmin; state.isSuperAdmin = !!b.isSuperAdmin; state.accessStores = b.accessStores || []; state.email = b.email || ''; state.employeeSelf = !!b.employeeSelf;
    state.homeStore = b.homeStore || '';
    state.store = state.homeStore || (savedStore && (savedStore === 'All' || state.stores.indexOf(savedStore) >= 0) ? savedStore : 'All');
    $('#appTitle').textContent = b.title || 'HUFT Roster';
    if (!b.month || !b.month.found) throw new Error('No roster data found.');
    keep(b.month);
    state.date = b.month.key === monthKey(b.todayIso) ? b.todayIso : b.month.key + '-01';
    render(); handleEmailActionLink(); // Load adjacent months only after the user navigates.
    // Load request totals once so tab badges are available before a tab is opened.
    state.workRequestsLoading = true;
    call('getEmployeeRequests').then(function (res) { state.workRequests = res.requests || []; state.workRequestsCanApprove = !!res.canApprove; state.workRequestsLoaded = true; state.workRequestsLoading = false; render(); }).catch(function () { state.workRequestsLoading = false; });
    state.deploymentRequestsLoading = true;
    call('getDeploymentRequests').then(function (res) { state.deploymentRequests = res.requests || []; state.deploymentRequestsLoaded = true; state.deploymentRequestsLoading = false; render(); }).catch(function () { state.deploymentRequestsLoading = false; });
  }).catch(function (err) {
    busy(false);
    $('#content').innerHTML = '<div class="panel glass empty"><strong>Could not load the roster</strong><br>' + esc(err && err.message ? err.message : err) +
      '<br><br><button class="btn" onclick="location.reload()">Try again</button></div>';
  });
})();
</script>
</body>
</html>
