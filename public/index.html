<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyderabad HUFT Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --text:#14213d;--muted:#5b6b88;--brand:#f46524;--brand2:#ff9a5a;
  --glass:rgba(255,255,255,.52);--glass-strong:rgba(255,255,255,.72);--glass-line:rgba(255,255,255,.75);
  --line:rgba(20,33,61,.10);--shadow:0 8px 32px rgba(31,45,90,.14);--radius:18px;
  --bg1:#dbe7ff;--bg2:#ffe4d3;--bg3:#e3d9ff;
  --blob1:#7aa7ff;--blob2:#ff9a5a;--blob3:#b79cff;
  color-scheme:light;
}
:root[data-theme=dark]{
  --text:#e8edf8;--muted:#9aa8c7;--brand:#ff7a3d;--brand2:#ffb07a;
  --glass:rgba(22,30,55,.50);--glass-strong:rgba(26,36,66,.72);--glass-line:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.10);--shadow:0 10px 34px rgba(0,0,0,.45);
  --bg1:#0b1226;--bg2:#1a1020;--bg3:#0f1a33;
  --blob1:#2c57c9;--blob2:#c2481a;--blob3:#5b3bb0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.bg{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.bg .b1{width:520px;height:520px;background:var(--blob1);left:-120px;top:-120px}
.bg .b2{width:460px;height:460px;background:var(--blob2);right:-100px;top:25%}
.bg .b3{width:520px;height:520px;background:var(--blob3);left:30%;bottom:-220px}

.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-strong)}}

/* shift tones */
.t-open{--c:#1d4ed8}.t-close{--c:#6d28d9}.t-mid{--c:#b45309}.t-spa{--c:#0f766e}
.t-train{--c:#0369a1}.t-dep{--c:#c2410c}.t-off{--c:#a16207}.t-leave{--c:#be123c}
.t-none{--c:#64748b}.t-other{--c:#334155}.t-gone{--c:#94a3b8}
:root[data-theme=dark] .t-open{--c:#93c5fd}:root[data-theme=dark] .t-close{--c:#c4b5fd}
:root[data-theme=dark] .t-mid{--c:#fcd34d}:root[data-theme=dark] .t-spa{--c:#5eead4}
:root[data-theme=dark] .t-train{--c:#7dd3fc}:root[data-theme=dark] .t-dep{--c:#fdba74}
:root[data-theme=dark] .t-off{--c:#fde68a}:root[data-theme=dark] .t-leave{--c:#fda4af}
:root[data-theme=dark] .t-none{--c:#94a3b8}:root[data-theme=dark] .t-other{--c:#e2e8f0}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.pill.t-none{background:transparent;border-style:dashed}
.pill.good{--c:#15803d}.pill.warn{--c:#a16207}.pill.bad{--c:#be123c}
:root[data-theme=dark] .pill.good{--c:#4ade80}:root[data-theme=dark] .pill.warn{--c:#fcd34d}:root[data-theme=dark] .pill.bad{--c:#fda4af}

/* top bar */
.topbar{position:sticky;top:12px;z-index:30;margin:12px 24px 0;border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:0 6px 16px rgba(244,101,36,.4)}
.brand-title{font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand-sub{font-size:12px;color:var(--muted)}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--glass-line);background:var(--glass-strong);border-radius:11px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s,background .12s;color:var(--text)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(31,45,90,.14)}
.btn:active{transform:none}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(244,101,36,.35)}
.btn.danger{color:#be123c}
:root[data-theme=dark] .btn.danger{color:#fda4af}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.save-state{font-size:12px;color:var(--muted);min-width:90px;text-align:right}
.save-state.saving{color:var(--brand)}
.save-state.saving::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;border:2px solid color-mix(in srgb,var(--brand) 28%,transparent);border-top-color:var(--brand);border-radius:50%;vertical-align:-1px;animation:save-spin .7s linear infinite}
@keyframes save-spin{to{transform:rotate(360deg)}}
.save-state.bad{color:#be123c;font-weight:700}
.activity-state{display:none;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.activity-state.on{display:inline-flex}
.activity-state i{width:12px;height:12px;border:2px solid color-mix(in srgb,var(--brand) 28%,transparent);border-top-color:var(--brand);border-radius:50%;animation:save-spin .7s linear infinite}
.progress{position:fixed;top:0;left:0;right:0;height:5px;margin:0;border-radius:0;overflow:hidden;opacity:0;z-index:9999;background:color-mix(in srgb,var(--brand) 14%,transparent);transition:opacity .16s}
.progress.on{opacity:1}
.progress::after{content:"";display:block;height:100%;width:34%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:0 4px 4px 0;box-shadow:0 0 10px color-mix(in srgb,var(--brand) 55%,transparent);animation:slide .9s infinite ease-in-out}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}

/* layout */
.wrap{width:100%;max-width:none;margin:0 auto;padding:14px 24px 40px 244px}
.tabs{position:fixed;left:16px;top:86px;bottom:16px;z-index:25;width:204px;display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:8px;border-radius:16px;overflow-x:hidden;overflow-y:auto;margin:0}
.tab{flex:0 0 auto;width:100%;text-align:left;white-space:normal;border:0;background:transparent;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--muted);transition:background .15s,color .15s}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(244,101,36,.32)}
.tab-count{display:inline-flex;align-items:center;justify-content:center;margin-left:6px;padding:2px 7px;border-radius:999px;background:rgba(52,65,87,.12);font-size:10px;font-weight:800;line-height:1.3;white-space:nowrap}
.tab[aria-selected=true] .tab-count{background:rgba(255,255,255,.24)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px}
.kpi-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c,#64748b) 16%,transparent);color:var(--c,#64748b);flex:none}
.kpi-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi-val{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.filters{border-radius:var(--radius);padding:12px 14px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inp,.sel{border:1px solid var(--line);background:var(--glass-strong);border-radius:10px;padding:8px 11px;outline:none;min-width:140px;color:var(--text)}
.inp:focus,.sel:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.inp.grow{flex:1;min-width:180px}
.sel option{color:#14213d;background:#fff}
.sp{flex:1}

/* panels */
.panel{border-radius:var(--radius);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-size:16px;letter-spacing:-.01em}
.panel-head .sub{font-size:12px;color:var(--muted)}
.banner{display:flex;align-items:center;gap:10px;padding:10px 16px;margin-bottom:14px;border-radius:14px;font-weight:600}
.banner.warn{background:color-mix(in srgb,#f59e0b 22%,var(--glass));border:1px solid color-mix(in srgb,#f59e0b 40%,transparent)}
.banner.bad{background:color-mix(in srgb,#e11d48 16%,var(--glass));border:1px solid color-mix(in srgb,#e11d48 35%,transparent)}
.banner span{font-weight:500;color:var(--muted)}

/* weekly table */
.tablewrap{overflow:auto;max-height:70vh}
table.roster{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-size:13px}
.roster th,.roster td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
.roster thead th{position:sticky;top:0;z-index:3;background:var(--glass-strong);font-weight:700;padding:10px 6px;font-size:12px}
.roster thead th small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.roster th.selcol{background:color-mix(in srgb,var(--brand) 22%,var(--glass-strong));color:var(--brand)}
.roster td.selcol{background:color-mix(in srgb,var(--brand) 8%,transparent)}
.badge{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:99px;font-size:10px;font-weight:800;background:var(--brand);color:#fff;letter-spacing:.04em}
.roster td.name{text-align:left;font-weight:700;white-space:nowrap}
.roster td.role{color:var(--muted);font-size:12px}
.roster .store-row td{text-align:left;background:color-mix(in srgb,var(--text) 7%,transparent);font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 12px}
.roster tr:hover td{background:color-mix(in srgb,var(--text) 4%,transparent)}
.roster tr.store-row:hover td{background:color-mix(in srgb,var(--text) 7%,transparent)}
select.shift{width:100%;min-width:104px;border-radius:9px;padding:6px 8px;font-weight:700;font-size:12px;cursor:pointer;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);outline:none}
select.shift:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
select.shift.t-none{background:transparent;border-style:dashed}
select.shift option{color:#14213d;background:#fff}
.cell-gone{color:var(--muted);font-size:12px;font-style:italic}
.tot{font-weight:700;color:var(--muted)}

/* month grid */
table.grid{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;padding:0}
.grid thead th{position:sticky;background:var(--glass-strong);z-index:3;height:28px;font-weight:700;color:var(--muted);min-width:34px}
.grid thead tr:first-child th{top:0}
.grid thead tr:nth-child(2) th{top:28px}
.grid th.day{cursor:pointer}
.grid th.day:hover{color:var(--text)}
.grid .name-col{position:sticky;left:0;z-index:2;background:var(--glass-strong);text-align:left;padding:0 12px;min-width:170px;font-weight:600;font-size:13px;white-space:nowrap}
.grid thead .name-col{z-index:4}
.grid .store-row td{background:color-mix(in srgb,var(--text) 7%,transparent);text-align:left;padding:7px 12px;font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.grid td.cell{height:30px;min-width:34px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.grid td.cell.t-none{background:transparent;color:var(--line);font-weight:400}
.grid td.cell.t-gone{background:transparent}
.grid .today{box-shadow:inset 0 2px 0 var(--brand)}
.grid th.sel,.grid td.sel{outline:2px solid var(--brand);outline-offset:-2px}
.grid th.sun{color:var(--brand)}
.grid td.tot{min-width:38px;padding:0 6px}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{display:inline-grid;place-items:center;min-width:22px;height:20px;border-radius:6px;padding:0 4px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);font-size:11px}
.month-calendar-wrap{overflow:auto;padding:12px}
.month-calendar{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:7px;min-width:1210px}
.month-weekday{text-align:center;text-transform:uppercase;font-size:11px;font-weight:800;color:var(--muted);padding:7px}
.month-day{min-height:175px;padding:8px;border:1px solid var(--line);border-radius:13px;background:var(--glass-strong);min-width:0}
.month-day.empty{background:color-mix(in srgb,var(--text) 3%,transparent);border-style:dashed}
.month-day.today{box-shadow:inset 0 0 0 2px var(--brand)}
.month-day.selected{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 22%,transparent)}
.month-date{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:2px 3px 8px;color:var(--text);font-weight:800;cursor:pointer;text-align:left}
.month-date:hover{color:var(--brand)}
.month-date small{font-size:9px;color:var(--brand);text-transform:uppercase}
.month-day-shifts{display:grid;gap:5px}
.month-shift{padding:5px 7px;border-radius:8px;border-left:3px solid var(--c,#64748b);background:color-mix(in srgb,var(--c,#64748b) 10%,var(--glass-strong));color:var(--c,#64748b);min-width:0}
.month-shift-label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.month-shift-names{font-size:10px;line-height:1.35;color:var(--text);overflow-wrap:anywhere;margin-top:2px}

/* overview */
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.store-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;gap:8px}
.store-head h3{margin:0;font-size:15px}
.store-meta{font-size:12px;color:var(--muted)}
.bar{height:6px;margin:0 16px 8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.role-label{margin:10px 16px 2px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.staff-list{list-style:none;margin:0;padding:0 8px 10px}
.staff{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px}
.staff:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 55% 28%);flex:none}
.profile-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--glass-strong)}
.staff-store-panel{margin-bottom:14px;padding-bottom:14px}
.employee-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:10px}
.employee-card{border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;overflow:hidden}
.employee-photo{width:84px;height:84px;border-radius:50%;object-fit:cover;display:grid;place-items:center;flex:none;border:3px solid var(--glass-line);box-shadow:0 5px 18px rgba(31,45,90,.16);background:var(--glass-strong)}
.avatar.employee-photo{font-size:30px}
.employee-card h3{font-size:15px;margin:8px 0 3px;max-width:100%;overflow-wrap:anywhere}
.employee-role{font-size:12px;font-weight:700;color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);padding:4px 11px;border-radius:999px}
.employee-details{width:100%;display:grid;gap:5px;text-align:left;margin:10px 0 11px;font-size:11px}
.employee-detail{display:flex;justify-content:space-between;gap:9px;border-bottom:1px solid var(--line);padding-bottom:4px}
.employee-detail span:first-child{color:var(--muted)}.employee-detail strong,.employee-detail a{font-weight:600;text-align:right;overflow-wrap:anywhere;color:var(--text)}
.employee-actions{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;width:100%;margin-top:auto}
.employee-actions .btn{font-size:10px;padding:5px 7px}
.punctuality-box{width:100%;margin:2px 0 10px;padding:8px;border:1px solid var(--line);border-radius:13px;background:color-mix(in srgb,var(--glass-strong) 72%,transparent);text-align:left}
.punctuality-top{display:flex;align-items:center;gap:10px}
.punctuality-pie{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--score-color) 0 var(--score),var(--line) var(--score) 100%);position:relative}
.punctuality-pie::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--glass-strong)}
.punctuality-pie span{position:relative;font-size:12px;font-weight:800;color:var(--text)}
.punctuality-copy{min-width:0;flex:1}.punctuality-copy strong{font-size:11px}.punctuality-copy small{display:block;color:var(--muted);font-size:9px;line-height:1.35;margin-top:2px}.punctuality-history-trigger{min-width:0;flex:1;text-align:left;padding:2px 0;border:0;background:transparent;color:inherit;cursor:pointer}.punctuality-history-trigger:hover strong,.punctuality-history-trigger:focus-visible strong{color:var(--brand);text-decoration:underline}.punctuality-history-trigger:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}.punctuality-history-table{width:100%;border-collapse:collapse;font-size:12px}.punctuality-history-table th,.punctuality-history-table td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.punctuality-history-table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--glass-strong)}.punctuality-history-wrap{max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.punctuality-disclosure{padding:0;overflow:hidden}.punctuality-summary{list-style:none;display:flex;align-items:center;gap:8px;padding:7px;cursor:pointer}.punctuality-summary::-webkit-details-marker{display:none}.punctuality-summary::after{content:"＋";margin-left:auto;color:var(--muted);font-size:12px}.punctuality-disclosure[open] .punctuality-summary::after{content:"−"}.punctuality-summary:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:10px}.punctuality-summary-copy{min-width:0;display:grid;gap:2px}.punctuality-summary-copy strong{font-size:10px;line-height:1.3}.punctuality-summary-copy small{font-size:9px;color:var(--muted)}.punctuality-expanded{padding:0 8px 8px}.punctuality-history-action{margin:4px 0 2px;width:100%;justify-content:center}.punctuality-events{display:grid;gap:4px;margin-top:8px;font-size:10px;color:var(--muted)}
.punctuality-event{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:4px}
.punctuality-action{margin-top:8px;width:100%;justify-content:center}
.profile-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:10px 0 4px}
.profile-calendar-head{text-align:center;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;padding:5px 1px}
.profile-day{border:1px solid var(--line);border-radius:10px;min-height:82px;padding:7px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;background:var(--glass)}
.profile-day.empty{border-color:transparent;background:transparent}
.profile-day-no{font-size:11px;font-weight:800;color:var(--muted)}
.profile-day-shift{font-size:10px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.profile-day-action{margin-top:auto;padding:2px 5px;font-size:9px;color:var(--brand);border:0;background:transparent;cursor:pointer;font-weight:800}
.calendar-loading{padding:22px 6px;color:var(--muted);text-align:center}
.calendar-loading::before{content:"";display:inline-block;width:11px;height:11px;margin-right:8px;border:2px solid color-mix(in srgb,var(--brand) 25%,transparent);border-top-color:var(--brand);border-radius:50%;vertical-align:-2px;animation:save-spin .7s linear infinite}
.profile-day.t-duty{background:color-mix(in srgb,#3b82f6 12%,var(--glass));color:#315d91}
.profile-day.t-off{background:color-mix(in srgb,#f59e0b 14%,var(--glass));color:#936b1b}
.profile-day.t-away{background:color-mix(in srgb,#e11d48 12%,var(--glass));color:#a44362}
.profile-day.t-none{background:var(--glass);color:var(--muted)}
.staff-identity{display:flex;align-items:center;gap:9px;min-width:0}
:root[data-theme=dark] .avatar{background:hsl(var(--h) 35% 26%);color:hsl(var(--h) 80% 88%)}
.who{flex:1;min-width:0}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.nm small{font-weight:500;color:var(--muted)}
.analytics{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(420px,1.5fr);gap:14px;margin-bottom:14px}
.chart-card{padding:16px;border-radius:var(--radius);min-width:0}
.chart-title{font-size:15px;font-weight:800;margin:0 0 3px}
.chart-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.shift-bars{display:grid;gap:13px}
.shift-row{display:grid;grid-template-columns:82px minmax(70px,1fr) 30px;align-items:center;gap:10px;font-size:12px;font-weight:600}
.shift-track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.shift-fill{height:100%;min-width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.trend-svg{display:block;width:100%;height:auto;overflow:visible}
.trend-grid{stroke:var(--line);stroke-width:1}
.trend-label{fill:var(--muted);font:11px Inter,system-ui,sans-serif}
.trend-duty{fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.trend-missing{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.trend-dot{fill:var(--brand);stroke:var(--glass-strong);stroke-width:2}
.chart-legend{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--muted)}
.chart-legend span{display:flex;align-items:center;gap:6px}.chart-legend i{width:9px;height:9px;border-radius:50%;background:var(--brand)}.chart-legend i.missing{background:#64748b}
html:fullscreen body{min-height:100vh;overflow:auto}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 16px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl .grp td{background:color-mix(in srgb,var(--text) 7%,transparent);font-weight:800;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tbl .acts{text-align:right;white-space:nowrap}
.tbl .acts .btn+.btn{margin-left:6px}
.individual-msg-wrap{max-width:1180px;overflow-x:auto}
.individual-msg-table{table-layout:fixed;min-width:680px}
.individual-msg-table th:nth-child(1),.individual-msg-table td:nth-child(1){width:34%}
.individual-msg-table th:nth-child(2),.individual-msg-table td:nth-child(2){width:18%}
.individual-msg-table th:nth-child(3),.individual-msg-table td:nth-child(3){width:24%}
.individual-msg-table th:nth-child(4),.individual-msg-table td:nth-child(4){width:24%;text-align:right;white-space:nowrap}
.individual-msg-table .btn{margin:2px}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--muted)}

/* whatsapp */
.section-title{margin:22px 0 10px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.msgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.whatsapp-layout{display:grid;grid-template-columns:minmax(280px,390px) minmax(680px,1fr);gap:14px;align-items:start}
.wa-summaries,.wa-individual{min-width:0}
.wa-summaries .msgs{grid-template-columns:minmax(0,1fr)}
.wa-summaries .msg{min-width:0}
.wa-individual .section-title{margin-top:22px}
.wa-individual .individual-msg-wrap{max-width:none}
.msg header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.msg h3{margin:0;font-size:15px}
.msg .actions{display:flex;gap:6px}
.msg pre{margin:0;padding:14px 16px;white-space:pre-wrap;font:13px/1.55 Inter,system-ui,sans-serif}

/* states */
.skeleton{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.sk{height:76px;border-radius:var(--radius);background:linear-gradient(90deg,var(--glass) 25%,var(--glass-strong) 50%,var(--glass) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border:1px solid var(--glass-line)}
@keyframes sh{to{background-position:-200% 0}}
.empty{padding:48px 16px;text-align:center;color:var(--muted);border-radius:var(--radius)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#14213d;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.35)}
:root[data-theme=dark] .toast{background:#e8edf8;color:#14213d}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#be123c;color:#fff}

/* modal */
.overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.modal{width:100%;max-width:440px;border-radius:22px;padding:22px;background:var(--glass-strong);max-height:92vh;overflow:auto}
.modal.modal-calendar{max-width:880px}
.modal h3{margin:0 0 4px;font-size:18px;letter-spacing:-.01em}
.modal .lead{margin:0 0 14px;color:var(--muted);font-size:13px}
.modal .fld{margin-bottom:12px}
.email-action-summary{display:grid;gap:7px;padding:12px;background:var(--glass);border:1px solid var(--line);border-radius:12px}.email-action-summary>div{font-size:13px}
.modal .inp,.modal .sel{width:100%}
.modal textarea.inp{resize:vertical;min-height:150px}
.photo-preview{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--line);border:1px solid var(--glass-line)}
.photo-hint{font-size:12px;color:var(--muted);margin-top:5px}
.photo-paste{border:1px dashed color-mix(in srgb,var(--brand) 55%,var(--line));border-radius:12px;padding:11px 12px;margin-top:8px;text-align:center;color:var(--muted);font-size:12px;cursor:text;background:color-mix(in srgb,var(--brand) 5%,transparent);outline:none}
.photo-paste:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .radio{display:flex;gap:8px;margin-bottom:12px}
.modal .radio label{flex:1;display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;cursor:pointer;font-weight:600;font-size:13px;text-transform:none;letter-spacing:0;color:var(--text)}
.modal .radio input{accent-color:var(--brand)}
.m-err{color:#be123c;font-weight:600;font-size:13px;min-height:18px;margin-bottom:6px}
:root[data-theme=dark] .m-err{color:#fda4af}
.m-actions{display:flex;justify-content:flex-end;gap:8px}
.hide{display:none!important}

@media(max-width:900px){.analytics{grid-template-columns:1fr}.wrap{padding-left:24px}.tabs{position:static;left:auto;top:auto;bottom:auto;z-index:auto;width:auto;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;margin-bottom:14px}.tab{flex:0 0 auto;width:auto;text-align:center;white-space:nowrap}}
@media(max-width:1050px){.whatsapp-layout{grid-template-columns:1fr}.wa-summaries .msgs{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}.wa-individual .section-title{margin-top:8px}}
@media(max-width:700px){.employee-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));padding:8px;gap:8px}.employee-card{padding:10px}.employee-photo{width:76px;height:76px}}
@media(max-width:600px){.profile-calendar{grid-template-columns:repeat(7,minmax(38px,1fr));overflow-x:auto}.profile-calendar-head{display:block;font-size:8px}.profile-day{min-height:68px;padding:4px}.profile-day-shift,.profile-day-action{font-size:8px}}
@media(max-width:700px){.topbar{margin:8px;top:8px}.wrap{padding:10px 10px 40px}.stores,.msgs{grid-template-columns:1fr}.inp.grow{min-width:100%}.fld,.inp,.sel{min-width:0}.fld{flex:1 1 140px}.modal .row2{grid-template-columns:1fr}.shift-row{grid-template-columns:75px minmax(60px,1fr) 24px}}
@media print{.topbar,.progress,.tabs,.filters,.toast,.bg,.overlay,.kpis{display:none!important}body{background:#fff}.glass{box-shadow:none;background:#fff;backdrop-filter:none}.tablewrap{max-height:none}select.shift{appearance:none}}
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/huft-config.js"></script>
<script src="./js/huft-supabase.js"></script>
<script src="./js/huft-api.js"></script>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<header class="topbar glass">
  <div class="brand">
    <div class="logo">H</div>
    <div>
      <div class="brand-title" id="appTitle">Hyderabad HUFT Roster</div>
      <div class="brand-sub" id="subtitle">Hyderabad team roster · Happy teams. Happy pets.</div>
    </div>
  </div>
  <div class="controls">
    <span id="saveState" class="save-state"></span>
    <span id="activityState" class="activity-state" role="status" aria-live="polite"><i aria-hidden="true"></i>Updating…</span>
    <button id="prev" class="btn" aria-label="Previous week">&#8592; Previous</button>
    <button id="btnToday" class="btn">Today</button>
    <button id="next" class="btn primary" aria-label="Next week">Next &#8594;</button>
    <button id="btnRefresh" class="btn" title="Reload from the sheet">&#8635; Refresh</button>
    <button id="btnTheme" class="btn" aria-label="Toggle dark mode">&#9680; Theme</button>
    <button id="btnDesktopShortcut" class="btn" title="Download a shortcut to this roster app">⇩ Desktop shortcut</button>
    <button id="btnFullscreen" class="btn" aria-label="Enter fullscreen">⛶ Full screen</button>
  </div>
</header>
<div class="progress" id="progress"></div>

<main class="wrap">
  <nav class="tabs glass" role="tablist">
    <button class="tab" role="tab" data-tab="week" aria-selected="true">Weekly roster</button>
    <button class="tab" role="tab" data-tab="month" aria-selected="false">Full month</button>
    <button class="tab" role="tab" data-tab="overview" aria-selected="false">All-store overview</button>
    <button class="tab" role="tab" data-tab="manage" aria-selected="false">Stores &amp; staff</button>
    <button class="tab" role="tab" data-tab="removed" aria-selected="false">Removed employees <span class="tab-count" id="removedEmployeesTabCount">0</span></button>
    <button class="tab" role="tab" data-tab="wa" aria-selected="false">WhatsApp</button>
    <button class="tab" role="tab" data-tab="deployments" aria-selected="false">Deployments <span class="tab-count" id="deploymentTabCount"></span></button>
    <button class="tab" role="tab" data-tab="myrequests" aria-selected="false">My requests <span class="tab-count" id="myRequestsTabCount"></span></button>
    <button class="tab" role="tab" data-tab="approvals" aria-selected="false">Approval centre <span class="tab-count" id="approvalTabCount"></span></button>
    <button class="tab" role="tab" data-tab="notifications" aria-selected="false">Live notifications <span class="tab-count" id="notificationsTabCount"></span></button>
    <button class="tab" role="tab" data-tab="request" aria-selected="false">Request access</button>
    <button class="tab hide" id="accessTab" role="tab" data-tab="access" aria-selected="false">Admin access</button><button class="tab hide" id="emailTab" role="tab" data-tab="email" aria-selected="false">Email settings</button>
  </nav>

  <section class="kpis" id="kpis"></section>

  <section class="filters glass">
    <div class="fld"><label for="storeSel">Store</label><select id="storeSel" class="sel"></select></div>
    <div class="fld"><label for="datePick">Selected date</label><input id="datePick" class="inp" type="date"></div>
    <div class="fld grow"><label for="search">Search team</label><input id="search" class="inp grow" type="search" placeholder="Search by name…"></div>
    <div class="fld"><label for="roleSel">Role</label>
      <select id="roleSel" class="sel"><option value="">All roles</option><option value="Retail">Retail</option><option value="Grooming">Groomers</option></select></div>
    <button id="btnExport" class="btn">⇩ Export JPG</button>
    <button id="btnPrint" class="btn">&#128424; Print</button>
  </section>

  <div id="content"><div class="skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>
</main>

<div id="modal" class="overlay" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status"></div>

<script>
(function () {
  'use strict';

  var CAT = {
    'Opening':{abbr:'O',cls:'open',label:'Opening',group:'duty',ord:1},
    'Mid':{abbr:'M',cls:'mid',label:'Mid shift',group:'duty',ord:2},
    'Spa':{abbr:'S',cls:'spa',label:'Spa timings',group:'duty',ord:3},
    'Training':{abbr:'T',cls:'train',label:'Training',group:'duty',ord:4},
    'Closing':{abbr:'C',cls:'close',label:'Closing',group:'duty',ord:5},
    'Deployed':{abbr:'→',cls:'dep',label:'Deployed',group:'duty',ord:6},
    'Other':{abbr:'•',cls:'other',label:'Other',group:'duty',ord:7},
    'Week off':{abbr:'WO',cls:'off',label:'Week off',group:'off',ord:8},
    'Comp off':{abbr:'CO',cls:'off',label:'Comp off',group:'off',ord:9},
    'Holiday':{abbr:'H',cls:'off',label:'Holiday',group:'off',ord:10},
    'Leave':{abbr:'L',cls:'leave',label:'Leave',group:'away',ord:11},
    'Absent':{abbr:'A',cls:'leave',label:'Absent',group:'away',ord:12},
    'Unassigned':{abbr:'·',cls:'none',label:'Not assigned',group:'none',ord:13},
    'Removed':{abbr:'×',cls:'gone',label:'Removed',group:'gone',ord:14}
  };
  var SHIFT_OPTS = ['Opening','Closing','Mid','Spa','Training','Week off','Comp off','Holiday','Leave','Absent'];
  var DUTY_SHIFTS = ['Opening','Closing','Mid','Spa','Training'];
  var WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  var state = {
    todayIso:'', appUrl:'', stores:[], months:[], data:{}, date:'', store:'All', homeStore:'', q:'', role:'',
    tab:'week', msgs:[], theme:'light', isAdmin:false, isSuperAdmin:false, accessStores:[], accessEntries:[], accessLoaded:false, accessLoading:false, emailAdminData:null, emailAdminLoading:false, emailTemplateId:"",
    deploymentRequests:[], deploymentRequestsLoaded:false, deploymentRequestsLoading:false, workRequests:[], workRequestsLoaded:false, workRequestsLoading:false, workRequestsCanApprove:false, employeeSelf:false, deletedStaff:[], deletedStaffLoaded:false, deletedStaffLoading:false,
    punctualityEvents:[], punctualityLoaded:false, punctualityLoading:false, email:'', photos:{}, photoRequests:{},
    pending:[], saving:false, flushTimer:null
  };

  var $ = function (s) { return document.querySelector(s); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  };

  /* ---------- dates (UTC maths, no timezone surprises) ---------- */
  function parseIso(iso) { var p = iso.split('-').map(Number); return {y:p[0], m:p[1], d:p[2]}; }
  function addDays(iso, n) {
    var p = parseIso(iso), dt = new Date(Date.UTC(p.y, p.m - 1, p.d + n));
    return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate());
  }
  function weekday(iso) { var p = parseIso(iso); return new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay(); }
  function weekStart(iso) { return addDays(iso, -((weekday(iso) + 6) % 7)); }
  function monthKey(iso) { return iso.slice(0, 7); }
  function fmtLong(iso) { var p = parseIso(iso); return WD[weekday(iso)] + ', ' + p.d + ' ' + MON[p.m - 1] + ' ' + p.y; }
  function fmtShort(iso) { var p = parseIso(iso); return pad(p.d) + '-' + pad(p.m) + '-' + p.y; }
  function fmtMsg(iso) { var p = parseIso(iso); return pad(p.d) + '-' + MON[p.m - 1] + '-' + p.y + ' (' + WD[weekday(iso)] + ')'; }

  /* ---------- server ---------- */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    state.serverCalls = (state.serverCalls || 0) + 1;
    syncActivityState();
    return new Promise(function (resolve, reject) {
      var finished = false;
      function finish(callback, value) {
        if (finished) return;
        finished = true;
        state.serverCalls = Math.max(0, (state.serverCalls || 1) - 1);
        syncActivityState(); callback(value);
      }
      try {
        window.HUFTApi.call(fn, ...args).then(function(value){finish(resolve,value);})
          .catch(function(e){finish(reject,new Error(e && e.message ? e.message : String(e)));});
      } catch (e) { finish(reject, e instanceof Error ? e : new Error(String(e))); }
    });
  }
  function syncActivityState() {
    var active = !!state.manualBusy || (state.serverCalls || 0) > 0;
    var el = document.getElementById('activityState');
    var bar = document.getElementById('progress');
    if (el) el.classList.toggle('on', (state.serverCalls || 0) > 0);
    if (bar) bar.classList.toggle('on', active);
  }
  function keep(d) {
    if (d && d.found) {
      d.idx = {};
      d.employees.forEach(function (e) { d.idx[e.id] = e; });
      state.data[d.key] = d;
    }
    return d;
  }
  function ensureMonth(key, force) {
    var have = state.data[key];
    if (!force && have) return Promise.resolve(have);
    return call('getMonthData', key, !!force).then(keep);
  }
  function rangeMonths(iso) {
    var ws = weekStart(iso), keys = [monthKey(iso), monthKey(ws), monthKey(addDays(ws, 6))], out = [];
    keys.forEach(function (k) { if (out.indexOf(k) < 0) out.push(k); });
    return out;
  }
  function ensureRange(iso, force) {
    return Promise.all(rangeMonths(iso).map(function (k) {
      return ensureMonth(k, force).catch(function (e) { if (k === monthKey(iso)) throw e; return null; });
    })).then(function () {
      if (!state.data[monthKey(iso)]) throw new Error('There is no roster tab for ' + monthKey(iso) + ' yet.');
    });
  }
  function busy(on) {
    state.manualBusy = !!on;
    syncActivityState();
  }

  /* ---------- data helpers ---------- */
  function monthData() { return state.data[monthKey(state.date)]; }
  function entryAt(id, iso) {
    var md = state.data[monthKey(iso)], emp = md && md.idx[id];
    if (!emp) return ['Unassigned', '', ''];
    var e = emp.days[parseIso(iso).d - 1];
    if (!e) return ['Unassigned', '', ''];
    return typeof e === 'string' ? [e, '', ''] : e;
  }
  function activeOn(e, iso, mode) {
    if (e.isDeployment) {
      var from = mode === 'week' ? weekStart(iso) : iso;
      return (e.deploymentDates || []).some(function (date) { return date >= from && date <= iso; });
    }
    return !e.removedOn || iso < e.removedOn;
  }
  function shiftName(s) { return (CAT[s] && CAT[s].label) || (s && s !== 'Other' ? s : ''); }
  function label(en) {
    var c = en[0];
    if (c === 'Deployed') {
      var sh = shiftName(en[1]);
      return '→ ' + (en[2] || 'Other store') + (sh ? ' · ' + sh : '');
    }
    if (c === 'Other') return en[1];
    return (CAT[c] || CAT.Other).label;
  }
  function filtered(md, iso, mode) {
    var q = state.q;
    return md.employees.filter(function (e) {
      return (state.store === 'All' || e.store === state.store) &&
             (!state.role || e.role === state.role) &&
             (!q || e.name.toLowerCase().indexOf(q) >= 0) &&
             (mode === 'week' || mode === 'manage' || e.isDeployment || entryAt(e.id, iso)[0] !== 'Deployed') &&
             activeOn(e, iso, mode);
    });
  }  function canEditStoreClient(store) {
    return !!state.isAdmin || state.accessStores.indexOf(store) >= 0;
  }
  function stats(emps, iso) {
    emps = emps.filter(function (e) { return e.isDeployment || entryAt(e.id, iso)[0] !== 'Deployed'; });
    var s = {total:emps.length, duty:0, opening:0, closing:0, other:0, off:0, away:0, none:0, noneNames:[], awayNames:[]};
    emps.forEach(function (e) {
      var en = entryAt(e.id, iso), c = en[0], m = CAT[c] || CAT.Other;
      if (m.group === 'duty') {
        s.duty++;
        var sh = c === 'Deployed' ? en[1] : c;
        if (sh === 'Opening') s.opening++; else if (sh === 'Closing') s.closing++; else s.other++;
      } else if (m.group === 'off') { s.off++; }
      else if (m.group === 'away') { s.away++; s.awayNames.push(e.name + ' (' + m.label + ')'); }
      else if (m.group === 'none') { s.none++; s.noneNames.push(e.name); }
    });
    return s;
  }  function storeRank(s) { var i = state.stores.indexOf(s); return i < 0 ? 99 : i; }
  function byStore(emps) {
    var map = {}, keys = [];
    emps.forEach(function (e) { if (!map[e.store]) { map[e.store] = []; keys.push(e.store); } map[e.store].push(e); });
    keys.sort(function (a, b) { return storeRank(a) - storeRank(b); });
    return keys.map(function (k) { return [k, map[k]]; });
  }
  function byRole(list) {
    var map = {}, keys = [];
    list.forEach(function (e) { if (!map[e.role]) { map[e.role] = []; keys.push(e.role); } map[e.role].push(e); });
    keys.sort(function (a, b) {
      var r = function (x) { return x === 'Retail' ? 0 : x === 'Grooming' ? 1 : 2; };
      return r(a) - r(b);
    });
    return keys.map(function (k) { return [k, map[k]]; });
  }
  function sortedForDay(list, iso) {
    return list.slice().sort(function (a, b) {
      var oa = (CAT[entryAt(a.id, iso)[0]] || CAT.Other).ord, ob = (CAT[entryAt(b.id, iso)[0]] || CAT.Other).ord;
      return oa - ob || a.name.localeCompare(b.name);
    });
  }
  function initials(n) { return n.split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0); }).join('').toUpperCase(); }
  function hue(n) { var h = 0; for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 360; return h; }
  function roleTitle(r) { return r === 'Grooming' ? 'Groomers' : r; }
  function findEmp(id, iso) {
    var md = state.data[monthKey(iso)];
    return md && md.idx[id] ? md.idx[id] : null;
  }
  function findEmpForEdit(id, iso) {
    var key = monthKey(iso), target = state.data[key];
    if (target && target.idx[id]) return target.idx[id];
    if (!target || !target.found) return null;
    var source = null;
    Object.keys(state.data).some(function (month) {
      var md = state.data[month];
      if (md && md.idx && md.idx[id]) { source = md.idx[id]; return true; }
      return false;
    });
    if (!source || !activeOn(source, iso)) return null;
    var copy = Object.assign({}, source, { days: new Array(target.daysInMonth).fill('Unassigned') });
    target.idx[id] = copy;
    target.employees.push(copy);
    return copy;
  }

  /* ---------- KPI strip ---------- */
  function kpi(ico, lbl, val, tone) {
    return '<div class="kpi glass t-' + tone + '"><div class="kpi-ico" style="--c:var(--c)">' + ico + '</div><div><div class="kpi-label">' +
      lbl + '</div><div class="kpi-val">' + val + '</div></div></div>';
  }
  function renderKpis(emps) {
    var s = stats(emps, state.date);
    $('#kpis').innerHTML =
      kpi('👥', 'Team members', s.total, 'open') +
      kpi('✔', 'Shifts to confirm', s.none, s.none ? 'mid' : 'spa') +
      kpi('🏖', 'Week offs', s.off, 'off') +
      kpi('🧳', 'Leave', s.away, 'leave') +
      kpi('📅', 'Selected date', fmtShort(state.date), 'close');
  }

  /* ---------- weekly roster (editable) ---------- */
  function cellSelect(e, iso) {
    var en = entryAt(e.id, iso), c = en[0], m = CAT[c] || CAT.Other;
    var sel = iso === state.date ? 'selcol' : '';
    if (c === 'Removed') return '<td class="' + sel + '"><span class="cell-gone">Removed</span></td>';
    if (e.isDeployment) return '<td class="' + sel + '"><span class="pill t-' + m.cls + '">' + (c === 'Unassigned' ? '—' : esc(label(en))) + '</span></td>';
    var o = '<option value="Clear"' + (c === 'Unassigned' ? ' selected' : '') + '>— Select —</option>';
    SHIFT_OPTS.forEach(function (k) {
      o += '<option value="' + k + '"' + (c === k ? ' selected' : '') + '>' + CAT[k].label + '</option>';
    });
    if (c === 'Deployed' || c === 'Other') o += '<option value="__keep__" selected>' + esc(label(en)) + '</option>';
    o += '<option value="__deploy__">→ Deploy to another store…</option>';
    return '<td class="' + sel + '"><select class="shift t-' + m.cls + '" data-id="' + esc(e.id) + '" data-date="' + iso + '"' +
      (canEditStoreClient(e.store) ? '' : ' disabled title="You do not have edit access to ' + esc(e.store) + '"') +
      ' aria-label="' + esc(e.name + ' ' + iso) + '">' + o + '</select></td>';
  }
  function dayMessage(e, iso, storeName) {
    var en = entryAt(e.id, iso);
    return 'Hi ' + e.name.split(' ')[0] + ', your shift on ' + fmtMsg(iso) + ' is: ' + label(en) + '. – HUFT ' + storeName;
  }

  function viewWeek(md) {
    var ws = weekStart(state.date), days = [], i;
    for (i = 0; i < 7; i++) days.push(addDays(ws, i));
    var we = days[6];
    var emps = filtered(md, we, 'week');
    if (!emps.length) return '<div class="panel glass empty">No team members match this filter.</div>';

    var head = '<tr><th style="text-align:left;min-width:150px">Employee</th><th>Role</th>';
    days.forEach(function (iso) {
      var badge = iso === state.todayIso ? '<span class="badge">TODAY</span>' : iso === addDays(state.todayIso, 1) ? '<span class="badge">NEXT DAY</span>' : '';
      head += '<th class="' + (iso === state.date ? 'selcol' : '') + '">' + WD[weekday(iso)].slice(0, 3) + '<small>' + fmtShort(iso) + '</small>' + badge + '</th>';
    });
    head += '<th>Week offs</th><th>WhatsApp</th></tr>';

    var body = '';
    byStore(emps).forEach(function (g) {
      body += '<tr class="store-row"><td colspan="11">' + esc(g[0]) + ' · ' + g[1].length + ' team members</td></tr>';
      byRole(g[1]).forEach(function (rg) {
        rg[1].forEach(function (e) {
          var offs = 0, tds = '';
          days.forEach(function (iso) {
            if ((CAT[entryAt(e.id, iso)[0]] || CAT.Other).group === 'off') offs++;
            tds += cellSelect(e, iso);
          });
          var act;
          if (e.isDeployment) act = '<span class="muted">Temporary assignment</span>'; else if (!e.phone) act ='<span class="muted">No number</span>';
          else if ((CAT[entryAt(e.id, state.date)[0]] || CAT.Other).group === 'none') act = '<span class="muted">Shift missing</span>';
          else act = '<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/' + e.phone + '?text=' + encodeURIComponent(dayMessage(e, state.date, g[0])) + '">📲 Send</a>';
          body += '<tr><td class="name">' + esc(e.name) + (e.isDeployment ? '<small style="display:block;font-size:10px;color:var(--muted)">Temporary · from ' + esc(e.homeStore) + '</small>' : '') + '</td><td class="role">' + esc(roleTitle(e.role)) + '</td>' + tds +
            '<td class="tot">' + offs + '</td><td>' + act + '</td></tr>';
        });
      });
    });

    var s = stats(filtered(md, state.date), state.date), banner = '';
    if (s.none) banner = '<div class="banner warn">⚠️ ' + s.none + ' daily shift' + (s.none > 1 ? 's' : '') + ' need an update on ' + esc(fmtShort(state.date)) +
      ' <span>' + esc(s.noneNames.slice(0, 6).join(', ')) + (s.noneNames.length > 6 ? '…' : '') + '</span></div>';

    return banner + '<div class="panel glass"><div class="panel-head"><div><h2>Weekly team roster</h2><div class="sub">Change a shift with its dropdown. Changes save to the sheet automatically.</div></div>' +
      '<div class="sub">' + esc(fmtShort(ws)) + ' – ' + esc(fmtShort(we)) + ' · ' + emps.length + ' team members</div></div>' +
      '<div class="tablewrap"><table class="roster"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></div>';
  }

  function exportWeeklyRoster() {
    var ws = weekStart(state.date), we = addDays(ws, 6), days = [];
    for (var i = 0; i < 7; i++) days.push(addDays(ws, i));
    var md = monthData();
    if (!md) { toast('Roster data is not ready yet.', true); return; }
    var employees = filtered(md, we, 'week').filter(function (e) {
      return (CAT[entryAt(e.id, we)[0]] || CAT.Other).group !== 'gone';
    });
    if (!employees.length) { toast('No staff to export for this week.', true); return; }

    var stores = state.store === 'All' ? byStore(employees) : [[state.store, employees]];
    var titleStore = state.store === 'All' ? 'All stores' : state.store;
    var width = 2048, margin = 20, nameW = 250, roleW = 150, dayW = (width - margin * 2 - nameW - roleW) / 7;
    var titleH = 70, headH = 80, sectionH = 42, rowH = 50, y = 20 + titleH + headH;
    var title = 'Weekoff roster · ' + titleStore + ' · ' + fmtShort(ws) + ' – ' + fmtShort(we);
    var svg = [];
    function rect(x, yy, w, h, fill) {
      svg.push('<rect x="' + x + '" y="' + yy + '" width="' + w + '" height="' + h + '" fill="' + fill + '" stroke="#84909b" stroke-width="1"/>');
    }
    function txt(x, yy, value, opts) {
      opts = opts || {};
      svg.push('<text x="' + x + '" y="' + yy + '" text-anchor="' + (opts.anchor || 'middle') + '" dominant-baseline="middle" fill="' + (opts.fill || '#344054') + '" font-family="Arial,sans-serif" font-size="' + (opts.size || 16) + '" font-weight="' + (opts.weight || 500) + '">' + esc(value) + '</text>');
    }
    rect(margin, 20, width - margin * 2, titleH, '#ef7825');
    txt(width / 2, 20 + titleH / 2, title, {fill:'#fff', size:24, weight:700});
    var hx = margin;
    [[nameW, 'Employee'], [roleW, 'Role']].forEach(function (col) {
      rect(hx, 20 + titleH, col[0], headH, '#f28a3b');
      txt(hx + col[0] / 2, 20 + titleH + headH / 2, col[1], {fill:'#fff', size:16, weight:700});
      hx += col[0];
    });
    days.forEach(function (d) {
      var p = parseIso(d), labelText = WD[weekday(d)] + ' · ' + pad(p.d) + '-' + MON[p.m - 1] + '-' + p.y;
      rect(hx, 20 + titleH, dayW, headH, '#f28a3b');
      txt(hx + dayW / 2, 20 + titleH + headH / 2, labelText, {fill:'#fff', size:14, weight:700});
      hx += dayW;
    });

    stores.forEach(function (sg) {
      if (state.store === 'All') {
        rect(margin, y, width - margin * 2, sectionH, '#f8d3ba');
        txt(width / 2, y + sectionH / 2, sg[0].toUpperCase(), {fill:'#81451e', size:16, weight:700});
        y += sectionH;
      }
      byRole(sg[1]).forEach(function (rg) {
        var section = rg[0] === 'Grooming' ? 'SPA' : String(roleTitle(rg[0])).toUpperCase();
        rect(margin, y, width - margin * 2, sectionH, '#ffead9');
        txt(width / 2, y + sectionH / 2, section, {fill:'#81451e', size:16, weight:700});
        y += sectionH;
        rg[1].slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (e) {
          var x = margin;
          rect(x, y, nameW, rowH, '#ffffff'); txt(x + 12, y + rowH / 2, e.name, {anchor:'start', size:15}); x += nameW;
          rect(x, y, roleW, rowH, '#ffffff'); txt(x + roleW / 2, y + rowH / 2, rg[0] === 'Grooming' ? 'SPA' : roleTitle(e.role), {size:15}); x += roleW;
          days.forEach(function (d) {
            var en = entryAt(e.id, d), group = (CAT[en[0]] || CAT.Other).group;
            var value = group === 'none' || group === 'gone' ? '' : label(en);
            var fill = group === 'duty' ? '#e7f0fc' : group === 'off' ? '#fff5d9' : group === 'away' ? '#fde9ee' : '#ffffff';
            var color = group === 'duty' ? '#315d91' : group === 'off' ? '#936b1b' : group === 'away' ? '#a44362' : '#344054';
            rect(x, y, dayW, rowH, fill); txt(x + dayW / 2, y + rowH / 2, value, {fill:color, size:14, weight:600}); x += dayW;
          });
          y += rowH;
        });
      });
    });

    var height = y + 20;
    var svgDoc = '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '"><rect width="100%" height="100%" fill="#ffffff"/>' + svg.join('') + '</svg>';
    var svgBlob = new Blob([svgDoc], {type:'image/svg+xml;charset=utf-8'});
    var url = URL.createObjectURL(svgBlob), image = new Image();
    image.onload = function () {
      var canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(image, 0, 0);
      canvas.toBlob(function (jpg) {
        URL.revokeObjectURL(url);
        if (!jpg) { toast('Could not create the roster image.', true); return; }
        var jpgUrl = URL.createObjectURL(jpg), a = document.createElement('a');
        var safeStore = titleStore.replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '');
        a.href = jpgUrl; a.download = 'HUFT_Roster_' + safeStore + '_' + ws + '_to_' + we + '.jpg';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(jpgUrl); }, 1000);
        toast('Roster JPG exported');
      }, 'image/jpeg', 0.95);
    };
    image.onerror = function () { URL.revokeObjectURL(url); toast('Could not create the roster image.', true); };
    image.src = url;
  }

  /* ---------- full month (read only) ---------- */
  function viewMonth(md) {
    var first = md.key + '-01', q = state.q;
    var emps = md.employees.filter(function (e) {
      return (state.store === 'All' || e.store === state.store) &&
        (!state.role || e.role === state.role) &&
        (!q || e.name.toLowerCase().indexOf(q) >= 0) &&
        (!e.removedOn || e.removedOn > first);
    });
    if (!emps.length) return '<div class="panel glass empty">No team members match this filter.</div>';
    var offset = (weekday(first) + 6) % 7, calendar = '<div class="month-calendar">';
    ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach(function (day) {
      calendar += '<div class="month-weekday">' + day + '</div>';
    });
    for (var blank = 0; blank < offset; blank++) calendar += '<div class="month-day empty"></div>';
    var order = ['Opening','Closing','Mid','Spa','Training','Deployed','Other','Week off','Comp off','Holiday','Leave','Absent','Unassigned'];
    var roleOrder = function (role) { return role === 'Retail' ? 0 : role === 'Grooming' ? 1 : 2; };
    for (var d = 1; d <= md.daysInMonth; d++) {
      var iso = md.key + '-' + pad(d), groups = {};
      emps.forEach(function (e) {
        var en = entryAt(e.id, iso), shift = en[0], meta = CAT[shift] || CAT.Other;
        if (meta.group === 'gone') return;
        var shiftLabel = shift === 'Deployed' || shift === 'Other' ? label(en) : meta.label;
        var key = shift + '|' + e.role + '|' + shiftLabel;
        if (!groups[key]) groups[key] = {shift:shift, role:e.role, label:shiftLabel, names:[]};
        var name = e.name;
        if (shift === 'Deployed' && en[2]) name += ' → ' + en[2];
        groups[key].names.push(name);
      });
      var shiftHtml = Object.keys(groups).sort(function (a, b) {
        var ga = groups[a], gb = groups[b], ia = order.indexOf(ga.shift), ib = order.indexOf(gb.shift);
        return (ia - ib) || roleOrder(ga.role) - roleOrder(gb.role) || ga.label.localeCompare(gb.label);
      }).map(function (key) {
        var g = groups[key], meta = CAT[g.shift] || CAT.Other;
        return '<div class="month-shift t-' + meta.cls + '"><div class="month-shift-label">' + esc(g.label) + ' · ' + esc(roleTitle(g.role)) + '</div>' +
          '<div class="month-shift-names">' + esc(g.names.join(', ')) + '</div></div>';
      }).join('');
      var dayClass = 'month-day' + (iso === state.todayIso ? ' today' : '') + (iso === state.date ? ' selected' : '');
      calendar += '<div class="' + dayClass + '"><button class="month-date" data-act="goto" data-date="' + iso + '"><span>' + d + '</span>' +
        (iso === state.todayIso ? '<small>Today</small>' : '') + '</button><div class="month-day-shifts">' + shiftHtml + '</div></div>';
    }
    calendar += '</div>';
    var legend = ['Opening','Closing','Mid','Spa','Training','Deployed','Week off','Comp off','Holiday','Leave','Absent','Unassigned'].map(function (k) {
      var m = CAT[k];
      return '<span class="t-' + m.cls + '"><b>' + m.abbr + '</b>' + m.label + '</span>';
    }).join('');
    return '<div class="panel glass"><div class="panel-head"><div><h2>' + esc(md.label) + '</h2><div class="sub">Calendar view · click a date to open that week. Staff are grouped by shift and role.</div></div></div>' +
      '<div class="month-calendar-wrap">' + calendar + '</div><div class="legend">' + legend + '</div></div>';
  }

  /* ---------- overview ---------- */
  function staffAvatar(e, large) {
    var photo = state.photos[e.photoKey || e.id];
    if (photo) return '<img class="' + (large ? 'employee-photo' : 'profile-avatar') + '" src="' + esc(photo) + '" alt="Profile photo of ' + esc(e.name) + '">';
    return '<span class="avatar' + (large ? ' employee-photo' : '') + '" style="--h:' + hue(e.name) + '">' + esc(initials(e.name)) + '</span>';
  }
  function loadStaffPhotos(emps) {
    var ids = emps.filter(function (e) {
      var key = e.photoKey || e.id; return e.photoId && !state.photos[key] && !state.photoRequests[key];
    }).slice(0, 50).map(function (e) { var key = e.photoKey || e.id; state.photoRequests[key] = true; return key; });
    if (!ids.length) return;
    call('getStaffPhotos', ids).then(function (photos) {
      Object.keys(photos || {}).forEach(function (id) { state.photos[id] = photos[id]; });
      render();
    }).catch(function () {});
  }
  function staffRow(e, iso) {
    var en = entryAt(e.id, iso), m = CAT[en[0]] || CAT.Other;
    return '<li class="staff">' + staffAvatar(e) +
      '<span class="who"><span class="nm">' + esc(e.name) + '</span></span><span class="pill t-' + m.cls + '">' +
      esc(label(en)) + '</span></li>';
  }
  function storeCard(store, list, iso) {
    var s = stats(list, iso), pct = s.total ? Math.round(s.duty / s.total * 100) : 0;
    var body = byRole(list).map(function (g) {
      return '<div class="role-label">' + esc(roleTitle(g[0])) + ' · ' + g[1].length + '</div><ul class="staff-list">' +
        sortedForDay(g[1], iso).map(function (e) { return staffRow(e, iso); }).join('') + '</ul>';
    }).join('');
    return '<article class="panel glass"><div class="store-head"><h3>' + esc(store) + '</h3><span class="store-meta">' +
      s.duty + ' / ' + s.total + ' on duty · O ' + s.opening + ' · C ' + s.closing + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>' + body + '</article>';
  }
  function overviewCharts(emps, iso) {
    var counts = {}, maxShift = 0;
    DUTY_SHIFTS.forEach(function (k) { counts[k] = 0; });
    emps.forEach(function (e) {
      var en = entryAt(e.id, iso), shift = en[0] === 'Deployed' ? en[1] : en[0];
      if (Object.prototype.hasOwnProperty.call(counts, shift)) counts[shift]++;
    });
    DUTY_SHIFTS.forEach(function (k) { maxShift = Math.max(maxShift, counts[k]); });
    var bars = DUTY_SHIFTS.map(function (k) {
      var pct = maxShift ? Math.round(counts[k] / maxShift * 100) : 0;
      return '<div class="shift-row"><span>' + esc(CAT[k].label) + '</span><div class="shift-track"><div class="shift-fill" style="width:' + pct + '%"></div></div><strong>' + counts[k] + '</strong></div>';
    }).join('');

    var days = [], max = 1;
    for (var i = 0; i < 7; i++) {
      var day = addDays(weekStart(iso), i), s = stats(emps, day);
      days.push({date:day, duty:s.duty, missing:s.none});
      max = Math.max(max, s.duty, s.none);
    }
    var left = 38, right = 610, top = 16, bottom = 145, span = Math.max(1, max);
    function xy(v, i) { return (left + i * (right - left) / 6) + ',' + (bottom - v / span * (bottom - top)); }
    var dutyPoints = days.map(function (d, i) { return xy(d.duty, i); }).join(' ');
    var missingPoints = days.map(function (d, i) { return xy(d.missing, i); }).join(' ');
    var grid = [0, Math.ceil(max / 2), max].filter(function (v, i, a) { return a.indexOf(v) === i; }).map(function (v) {
      var y = bottom - v / span * (bottom - top);
      return '<line class="trend-grid" x1="' + left + '" y1="' + y + '" x2="' + right + '" y2="' + y + '"></line><text class="trend-label" x="25" y="' + (y + 4) + '" text-anchor="end">' + v + '</text>';
    }).join('');
    var labels = days.map(function (d, i) {
      var x = left + i * (right - left) / 6;
      return '<text class="trend-label" x="' + x + '" y="170" text-anchor="middle">' + WD[weekday(d.date)].slice(0, 3) + '</text>';
    }).join('');
    var dots = days.map(function (d, i) {
      var p = xy(d.duty, i).split(',');
      return '<circle class="trend-dot" cx="' + p[0] + '" cy="' + p[1] + '" r="4"><title>' + esc(WD[weekday(d.date)] + ': ' + d.duty + ' on duty') + '</title></circle>';
    }).join('');
    return '<div class="analytics"><section class="panel glass chart-card"><h2 class="chart-title">Shift mix</h2><div class="chart-sub">Selected date · ' + esc(fmtShort(iso)) + '</div><div class="shift-bars">' + bars + '</div></section>' +
      '<section class="panel glass chart-card"><h2 class="chart-title">Seven-day coverage</h2><div class="chart-sub">Daily staffing across the week of ' + esc(fmtShort(weekStart(iso))) + '</div>' +
      '<svg class="trend-svg" viewBox="0 0 630 180" role="img" aria-label="Seven-day trend of staff on duty and shifts not assigned">' + grid +
      '<polyline class="trend-missing" points="' + missingPoints + '"></polyline><polyline class="trend-duty" points="' + dutyPoints + '"></polyline>' + dots + labels + '</svg>' +
      '<div class="chart-legend"><span><i></i>On duty</span><span><i class="missing"></i>Unassigned shifts</span></div></section></div>';
  }
  function viewOverview(md) {
    var emps = filtered(md, state.date);
    if (!emps.length) return '<div class="panel glass empty">No team members match this filter.</div>';
    var s = stats(emps, state.date), html = '';
    if (s.none) html += '<div class="banner warn">⚠️ ' + s.none + ' without a shift <span>' + esc(s.noneNames.slice(0, 10).join(', ')) + (s.noneNames.length > 10 ? '…' : '') + '</span></div>';
    if (s.away) html += '<div class="banner bad">🧳 ' + s.away + ' on leave or absent <span>' + esc(s.awayNames.join(', ')) + '</span></div>';
    html += overviewCharts(emps, state.date) + '<div class="stores">' + byStore(emps).map(function (g) { return storeCard(g[0], g[1], state.date); }).join('') + '</div>';
    return html;
  }

  function samePunctualityEmployee(event, employee) {
    var eventCode = String(event.employeeId || '').trim().toLowerCase();
    var employeeCode = String(employee.employeeId || '').trim().toLowerCase();
    if (eventCode && employeeCode) return eventCode === employeeCode;
    return String(event.store).toLowerCase() === String(employee.store).toLowerCase() &&
      String(event.name).replace(/\s+/g, ' ').trim().toLowerCase() === String(employee.name).replace(/\s+/g, ' ').trim().toLowerCase();
  }
  function punctualityProfile(e, allowRecord) {
    if (!state.punctualityLoaded) return '<div class="punctuality-box"><small class="muted">Loading punctuality records…</small></div>';
    var events = state.punctualityEvents.filter(function (x) { return samePunctualityEmployee(x, e); })
      .sort(function (a, b) { return b.date.localeCompare(a.date); });
    var leaves = events.filter(function (x) { return x.type === 'Unapproved leave'; }).length;
    var informed = events.filter(function (x) { return x.type === 'Late reporting' && x.notice === 'Informed'; }).length;
    var uninformed = events.filter(function (x) { return x.type === 'Late reporting' && x.notice !== 'Informed'; }).length;
    var score = Math.max(0, 100 - leaves * 20 - informed * 5 - uninformed * 10);
    var color = score >= 80 ? '#16a34a' : score >= 50 ? '#d97706' : '#e11d48';
    var history = events.slice(0, 3).map(function (x) {
      var label = x.type === 'Unapproved leave' ? 'Unapproved leave' : 'Late ' + (x.minutes || 0) + ' min · ' + (x.notice || 'Not informed');
      return '<div class="punctuality-event"><span>' + esc(fmtShort(x.date)) + ' · ' + esc(label) + '</span><span title="' + esc(x.details || '') + '">' + esc(x.details || '') + '</span></div>';
    }).join('');
    var action = allowRecord !== false && canEditStoreClient(e.store)
      ? '<button class="btn sm punctuality-action" data-act="recordPunctuality" data-store="' + esc(e.store) + '" data-name="' + esc(e.name) + '" data-employee-id="' + esc(e.employeeId || '') + '">＋ Add punctuality record</button>'
      : '';
    return '<details class="punctuality-box punctuality-disclosure"><summary class="punctuality-summary"><div class="punctuality-pie" style="--score:' + score + '%;--score-color:' + color + '" title="Punctuality score ' + score + ' out of 100"><span>' + score + '</span></div><span class="punctuality-summary-copy"><strong>Punctuality score · ' + score + '/100</strong><small>Click to view score details</small></span></summary>' +
      '<div class="punctuality-expanded"><div class="punctuality-copy"><small>' + leaves + ' unapproved leave · ' + (informed + uninformed) + ' late reports</small></div>' +
      '<button type="button" class="btn sm punctuality-history-action" data-act="punctualityHistory" data-store="' + esc(e.store) + '" data-name="' + esc(e.name) + '" data-employee-id="' + esc(e.employeeId || '') + '">View date-wise history (' + events.length + ')</button>' +
      '<div class="punctuality-events">' + (history || '<div class="punctuality-event"><span>No records</span></div>') + '</div>' +
      '<small class="muted">Score: −20 per unapproved leave, −5 informed late, −10 uninformed late.</small>' + action + '</div></details>';

  function openPunctualityHistory(store, name, employeeId) {
    var employee = { store:store, name:name, employeeId:employeeId || '' };
    var events = state.punctualityEvents.filter(function (x) { return samePunctualityEmployee(x, employee); })
      .sort(function (a, b) { return a.date.localeCompare(b.date) || String(a.recordedAt || '').localeCompare(String(b.recordedAt || '')); });
    var score = 100;
    var rows = events.map(function (x) {
      var deduction = x.type === 'Unapproved leave' ? 20 : x.type === 'Late reporting' ? (x.notice === 'Informed' ? 5 : 10) : 0;
      var before = score;
      score = Math.max(0, score - deduction);
      var applied = before - score;
      var incident = x.type === 'Late reporting' ? 'Late reporting · ' + (x.minutes || 0) + ' min · ' + (x.notice || 'Not informed') : x.type;
      return { date:x.date, incident:incident, deduction:applied, before:before, score:score, details:x.details || '', recordedBy:x.recordedBy || '' };
    }).reverse();
    var table = rows.length
      ? '<div class="punctuality-history-wrap"><table class="punctuality-history-table"><thead><tr><th>Date</th><th>Incident</th><th>Score change</th><th>Score after</th><th>Details</th><th>Recorded by</th></tr></thead><tbody>' + rows.map(function (r) {
          return '<tr><td>' + esc(fmtShort(r.date)) + '</td><td>' + esc(r.incident) + '</td><td>−' + r.deduction + ' <span class="muted">(' + r.before + ' → ' + r.score + ')</span></td><td><strong>' + r.score + '/100</strong></td><td>' + esc(r.details || '—') + '</td><td>' + esc(r.recordedBy || '—') + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<div class="empty">No punctuality incidents are recorded for this employee.</div>';
    openModal('Punctuality history · ' + esc(name), 'Date-wise incidents and score changes. Scores are reconstructed from the recorded incidents using the current rules.', table, 'Close', function () {});
  }

  /* ---------- whatsapp ---------- */
  function storeMessage(store, list, iso) {
    var duty = [], retailOffs = [], groomOffs = [], deployedOut = [];
    var openers = [], closers = [];

    list.forEach(function (e) {
      var en = entryAt(e.id, iso);
      var shift = en[0];
      var group = (CAT[shift] || CAT.Other).group;
      var isGroomer = e.role === 'Grooming';

      if (group === 'duty') {
        if (shift === 'Deployed' && en[2] && en[2] !== store) {
          deployedOut.push([e, en]);
          return;
        }
        duty.push([e, en]);

        var actualShift = shift === 'Deployed' ? en[1] : shift;
        // Key handover is a Retail responsibility; groomers never appear here.
        if (!isGroomer && (shift !== 'Deployed' || en[2] === store)) {
          if (actualShift === 'Opening') openers.push(e.name);
          if (actualShift === 'Closing') closers.push(e.name);
        }
      } else if (group !== 'gone') {
        if (isGroomer) groomOffs.push([e, en]);
        else retailOffs.push([e, en]);
      }
    });

    var retail = duty.filter(function (p) {
      return p[0].role !== 'Grooming';
    });

    var groomers = duty.filter(function (p) {
      return p[0].role === 'Grooming';
    });

    function shiftPeople(people, shiftName) {
      return people.filter(function (p) {
        var en = p[1];
        var actualShift = en[0] === 'Deployed' ? en[1] : en[0];
        return actualShift === shiftName;
      }).map(function (p) {
        return p[0].name;
      });
    }

    function lines(people) {
      return people.map(function (p) {
        return '• ' + p[0].name + ' – ' + label(p[1]);
      });
    }

    var openingRetail = shiftPeople(retail, 'Opening');
    var closingRetail = shiftPeople(retail, 'Closing');
    var supporting = duty.filter(function (p) { return !!p[0].isDeployment; });
    var openingGroomers = shiftPeople(groomers, 'Opening');
    var closingGroomers = shiftPeople(groomers, 'Closing');

    var out = [
      '📅 Date: ' + fmtMsg(iso),
      '🏬 Store: ' + store,
      '',
      '👥 Total staff on duty: ' + duty.length,
      '',
      '🛒 Retail staff (' + retail.length + ')'
    ];

    if (deployedOut.length) {
      out.push('', '📤 Staff deployed to another store');
      deployedOut.forEach(function (p) {
        var person = p[0], entry = p[1];
        var shiftText = entry[1] ? shiftName(entry[1]) : 'Shift not specified';
        out.push('• ' + person.name + ' – ' + roleTitle(person.role) + ' · from ' + store + ' to ' + entry[2] + ' · ' + shiftText);
      });
    }

    if (supporting.length) {
      out.push('', '🤝 Supporting staff (temporary deployment)');
      supporting.forEach(function (p) {
        var person = p[0], entry = p[1];
        var actualShift = entry[0] === 'Deployed' ? entry[1] : entry[0];
        var shiftText = actualShift ? shiftName(actualShift) : 'Shift not specified';
        out.push('• ' + person.name + ' – ' + roleTitle(person.role) + ' · from ' + (person.homeStore || 'home store') + ' · ' + shiftText);
      });
      out.push('');
    }

    if (openingRetail.length) out.push('🔓 Opening shift: ' + openingRetail.join(', '));
    if (closingRetail.length) out.push('🔒 Closing shift: ' + closingRetail.join(', '));
    out.push('', '⚠️ Leaves & offs (Retail)');

    out = out.concat(
      retailOffs.length ? lines(retailOffs) : ['• No leaves & offs']
    );

    out.push('', '✂️ Groomers (' + groomers.length + ')');
    if (openingGroomers.length) out.push('🔓 Opening shift: ' + openingGroomers.join(', '));
    if (closingGroomers.length) out.push('🔒 Closing shift: ' + closingGroomers.join(', '));
    out.push('', '⚠️ Leaves & offs (Groomers)');

    out = out.concat(
      groomOffs.length ? lines(groomOffs) : ['• No leaves & offs']
    );

    if (openers.length || closers.length) {
      out.push('', '🔑 Key handover');
      if (openers.length) out.push('• Opening key: ' + openers.join(', '));
      if (closers.length) out.push('• Closing key: ' + closers.join(', '));
    }

    return out.join('\n');
  }

  function copyText(text) {

      try { document.execCommand('copy'); toast('Copied to clipboard'); } catch (e) { toast('Copy failed', true); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Copied to clipboard'); }, fallback);
    } else fallback();

    if (!/^image\//.test(file.type || '')) return Promise.reject(new Error('Choose an image file.'));
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Could not read that image.')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('Could not open that image.')); };
        img.onload = function () {
          var side = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - side) / 2, sy = (img.naturalHeight - side) / 2;
          var canvas = document.createElement('canvas'); canvas.width = 320; canvas.height = 320;
          canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, 320, 320);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ---------- navigation ---------- */
  function setDate(iso) {
    if (!iso) return Promise.resolve();
    busy(true);
    return ensureRange(iso).then(function () {
      busy(false); state.date = iso; render(); prefetch();
    }, function (err) { busy(false); toast(err.message, true); render(); });
  }
  function prefetch() {
    [addDays(state.date, -31), addDays(state.date, 31)].forEach(function (iso) {
      var k = monthKey(iso);
      var known = state.months.some(function (m) { return m.key === k; });
      if (known && !state.data[k]) ensureMonth(k).catch(function () {});
    });
  }
  function refresh() {
    busy(true);
    state.data = {};
    ensureRange(state.date, true).then(function () { busy(false); render(); toast('Roster refreshed'); },
      function (e) { busy(false); toast('Refresh failed: ' + e.message, true); });
  }
  function applyTheme(t) {
    state.theme = t;
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('huft-theme', t); } catch (e) {}
  }

    var blob = new Blob(['[InternetShortcut]\r\nURL=' + url + '\r\n'], {type:'application/internet-shortcut'});

  $('#content').addEventListener('click', function (e) {

    if (act === 'copy') copyText(state.msgs[Number(b.dataset.i)] || '');

        state.deletedStaffLoaded = false;
