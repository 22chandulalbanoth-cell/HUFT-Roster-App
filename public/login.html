<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUFT Roster Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#dbe7ff,#ffe4d3,#e3d9ff);font:15px Inter,Arial;color:#14213d}.card{width:min(420px,90vw);padding:32px;border-radius:22px;background:#ffffffc9;box-shadow:0 12px 40px #14213d22;border:1px solid #fff}h1{margin:0 0 8px}p{color:#5b6b88}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #ccd4e3;margin:8px 0;font:inherit}button{background:#f46524;color:#fff;border:0;font-weight:700;cursor:pointer}#msg{min-height:22px;color:#b42318}</style></head><body><main class="card"><h1>🐾 HUFT Roster</h1><p>Sign in with your authorised HUFT work email.</p><form id="f"><input id="email" type="email" placeholder="Work email" required autocomplete="username"><input id="password" type="password" placeholder="Password" required autocomplete="current-password"><button id="go">Sign in</button></form><div id="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./js/huft-config.js"></script><script src="./js/huft-supabase.js"></script><script>const f=document.getElementById('f'),msg=document.getElementById('msg');f.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('go');b.disabled=true;b.textContent='Signing in…';try{if(!window.huftDb)throw Error('Configure Supabase URL and publishable key in js/huft-config.js');const r=await huftDb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)throw r.error;const p=await huftDb.from('profiles').select('is_active').eq('id',r.data.user.id).single();if(p.error||!p.data.is_active)throw Error('This account is not enabled for HUFT Roster. Contact the administrator.');location.href='index.html';}catch(x){msg.textContent=x.message||String(x);b.disabled=false;b.textContent='Sign in';}};</script></body></html>
